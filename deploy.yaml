name: Deploy WordPress to Lightsail

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy theme, plugins and uploads to Lightsail
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STATIC_IP }}
          username: bitnami
          key: ${{ secrets.SSH_KEY }}
          source: |
            wp-content/themes/*
            wp-content/plugins/*
            wp-content/uploads/*
          target: /opt/bitnami/wordpress/wp-content/

      - name: Upload database export
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STATIC_IP }}
          username: bitnami
          key: ${{ secrets.SSH_KEY }}
          source: database/latest.sql
          target: /tmp/

      - name: Import database into Lightsail WordPress
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STATIC_IP }}
          username: bitnami
          key: ${{ secrets.SSH_KEY }}
          script: |
            mysql -u bitnami -p${{ secrets.BITNAMI_WORDPRESS_PASSWORD }} bitnami_wordpress < /tmp/database/latest.sql
            rm /tmp/database/latest.sql
