name: Deploy WordPress to Lightsail

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy theme/plugins/uploads to Lightsail
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: bitnami
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: |
            wp-content/themes/*
            wp-content/plugins/*
            wp-content/uploads/*
          target: "/opt/bitnami/wordpress/wp-content/"

      - name: Deploy database to Lightsail
        run: |
          scp -i ${{ secrets.LIGHTSAIL_SSH_KEY }} database/latest.sql bitnami@${{ secrets.LIGHTSAIL_HOST }}:/tmp/latest.sql
          ssh -i ${{ secrets.LIGHTSAIL_SSH_KEY }} bitnami@${{ secrets.LIGHTSAIL_HOST }} "
            mysql -u bitnami -p\$BITNAMI_WORDPRESS_PASSWORD bitnami_wordpress < /tmp/latest.sql
          "
